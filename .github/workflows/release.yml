name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v2

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build VSIX
        run: npx vsce package --no-dependencies

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.PAT_TOKEN }}
          files: |
            git-opener-${{ steps.version.outputs.version }}.vsix
          body: |
            ## 🛠 Manual Installation

            Download `git-opener-${{ steps.version.outputs.version }}.vsix` and run:

            ```bash
            # VS Code
            code --install-extension git-opener-${{ steps.version.outputs.version }}.vsix --force

            # Cursor
            cursor --install-extension git-opener-${{ steps.version.outputs.version }}.vsix --force

            # Antigravity
            antigravity --install-extension git-opener-${{ steps.version.outputs.version }}.vsix --force
            ```
          generate_release_notes: true

      - name: Publish to VS Code Marketplace
        run: npx vsce publish --no-dependencies -p ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX
        run: npx ovsx publish git-opener-${{ steps.version.outputs.version }}.vsix -p ${{ secrets.OPEN_VSX_TOKEN }}
